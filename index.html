<!doctype html>
<html lang="fr" data-theme="sombre">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1116" />
    <meta name="description" content="Aide à la rédaction d'observations médicales au déchocage — fonctionne hors ligne, données gardées sur le téléphone." />
    <title>Observation Déchocage</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div id="app"><p class="chargement">Chargement…</p></div>
    <div id="feuilles"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <noscript>JavaScript est nécessaire pour utiliser cette application.</noscript>
    <script>
      // Si un fichier de configuration contient une erreur de syntaxe, l'afficher au lieu d'un écran vide
      window.addEventListener("error", function (e) {
        var app = document.getElementById("app");
        if (app && app.querySelector(".chargement")) {
          app.innerHTML =
            '<div class="erreur-config"><h1>Erreur au chargement</h1><p>Un fichier de configuration contient probablement une erreur (virgule, guillemet ou accolade manquante).</p><pre></pre></div>';
          app.querySelector("pre").textContent = (e.filename || "") + " (ligne " + (e.lineno || "?") + ")\n" + (e.message || "");
        }
      });
    </script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
